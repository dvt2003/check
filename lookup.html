<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Face ID - Tra Cứu</title>
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',sans-serif}
    body,html{width:100%;min-height:100vh;min-height:100dvh;background:radial-gradient(circle at 50% 20%,#0f172a 0%,#020617 100%);display:flex;justify-content:center;align-items:center;padding:15px;color:#f8fafc}
    .app-card{display:flex;background:rgba(30,41,59,.65);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:clamp(16px,5vw,28px);border-radius:clamp(20px,5vw,36px);box-shadow:0 30px 60px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.05);width:100%;max-width:420px;flex-direction:column;gap:clamp(16px,4vw,22px);animation:fadeIn .4s ease-out}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .app-header h2{font-size:clamp(1.1rem,5vw,1.4rem);font-weight:800;color:#38bdf8;text-align:center;text-transform:uppercase;letter-spacing:1px}
    .section-card{display:flex;flex-direction:column;gap:clamp(14px,3vw,18px)}
    .camera-container{position:relative;width:100%;aspect-ratio:1;max-height:55vh;background:#000;border-radius:clamp(20px,5vw,28px);overflow:hidden;display:flex;align-items:center;justify-content:center;border:2px solid #1e293b;-webkit-mask-image:-webkit-radial-gradient(white,black)}
    #video{width:100%;height:100%;object-fit:cover;filter:contrast(1.05);transition:.3s}
    #video.front-camera{transform:scaleX(-1);-webkit-transform:scaleX(-1)}
    .face-guide-circle{position:absolute;width:70%;height:70%;max-width:280px;max-height:280px;border:2px dashed rgba(56,189,248,.4);border-radius:50%;pointer-events:none;z-index:5;transition:.3s}
    .face-guide-circle.active{border-color:#38bdf8;border-style:solid;border-width:3px;box-shadow:0 0 35px rgba(56,189,248,.5);transform:scale(1.05)}
    .icon-btn{position:absolute;top:14px;right:14px;width:32px;height:32px;background:0 0;color:#FFF;border:none;cursor:pointer;z-index:30;transition:.3s}
    .icon-btn:hover{transform:scale(1.15) rotate(180deg)}
    .icon-btn svg{width:18px;height:18px;stroke:currentColor;filter:drop-shadow(0 2px 4px rgba(0,0,0,.8))}
    .progress-container{width:100%;background:rgba(255,255,255,.08);height:6px;border-radius:4px;overflow:hidden;margin-bottom:-10px}
    .progress-bar{width:0%;height:100%;background:linear-gradient(90deg,#0284c7,#38bdf8);transition:.05s}
    .status-box{font-size:clamp(.8rem,3vw,.85rem);font-weight:600;color:#94a3b8;text-align:center;min-height:24px}
    .btn{width:100%;padding:clamp(12px,3vw,16px);border:none;border-radius:20px;font-weight:700;font-size:clamp(.95rem,4vw,1.05rem);cursor:pointer;transition:.3s;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-primary{background:linear-gradient(135deg,#0284c7 0%,#38bdf8 100%);color:#fff;box-shadow:0 10px 25px rgba(56,189,248,.3)}
    .btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 15px 30px rgba(56,189,248,.5)}
    #section-profile{display:none;text-align:center}
    .profile-avatar{width:clamp(110px,30vw,140px);height:clamp(110px,30vw,140px);margin:0 auto 16px;border-radius:50%;padding:4px;background:linear-gradient(135deg,#0284c7,#38bdf8);box-shadow:0 0 40px rgba(56,189,248,.4)}
    .profile-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid #0f172a}
    .profile-title{color:#38bdf8;font-weight:800;font-size:clamp(1.1rem,5vw,1.3rem);margin-bottom:20px;text-transform:uppercase;letter-spacing:2px}
    .info-group{background:rgba(2,6,23,.6);border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:clamp(10px,3vw,14px) 16px;display:flex;flex-direction:column;gap:6px;text-align:left;margin-bottom:12px}
    .info-group label{font-size:.75rem;color:#64748b;text-transform:uppercase;font-weight:800}
    .info-group .value{font-size:clamp(1.05rem,4vw,1.2rem);color:#fff;font-weight:700}
    .info-group .value.highlight{color:#38bdf8;font-size:clamp(1.2rem,5vw,1.4rem)}
    .copy-btn{background:rgba(56,189,248,.15);border:1px solid rgba(56,189,248,.3);color:#38bdf8;padding:6px 12px;border-radius:10px;font-size:.8rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
    .flex-row{display:flex;justify-content:space-between;align-items:center}
  </style>
</head>
<body>
  <div class="app-card" id="app-card">
    <div class="app-header"><h2 id="header-subtitle">Tra Cứu Dữ Liệu</h2></div>
    
    <div id="section-scan" class="section-card">
      <div class="camera-container" id="container">
        <button id="btn-switch" class="icon-btn" onclick="switchCamera()" title="Đổi camera" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 9a9 9 0 0 0-14.77-5.08L1 9"/><polyline points="1 4 1 9 6 9"/><path d="M3 15a9 9 0 0 0 14.77 5.08L23 15"/><polyline points="23 20 23 15 18 15"/></svg>
        </button>
        <div id="guide-circle" class="face-guide-circle"></div>
        <video id="video" autoplay muted playsinline></video>
      </div>
      <div class="progress-container"><div id="progress-bar" class="progress-bar"></div></div>
      <div id="status-box" class="status-box">Đang khởi động hệ thống...</div>
    </div>

    <div id="section-profile" class="section-card">
      <div class="profile-title">Hồ Sơ Nhân Sự</div>
      <div class="profile-avatar"><img id="profile-img" src=""></div>
      
      <div class="info-group">
        <label>Mã Định Danh (ID)</label>
        <div class="flex-row">
          <div id="profile-id" class="value highlight">---</div>
          <button class="copy-btn" onclick="copyID('profile-id',this)">Copy</button>
        </div>
      </div>
      <div class="info-group"><label>Đăng Ký Lần Đầu</label><div id="profile-time" class="value">---</div></div>
      <button class="btn btn-primary" style="margin-top:10px" onclick="resumeScanning()">🔍 Tiếp tục tra cứu</button>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
