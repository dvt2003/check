<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Face ID - Đăng ký</title>
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',sans-serif}
    body,html{width:100%;min-height:100vh;min-height:100dvh;background:radial-gradient(circle at 50% 20%,#1e1b4b 0%,#0f172a 100%);display:flex;justify-content:center;align-items:center;padding:15px;color:#f8fafc}
    .app-card{display:flex;background:rgba(30,41,59,.65);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:clamp(16px,5vw,28px);border-radius:clamp(20px,5vw,36px);box-shadow:0 30px 60px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.08);width:100%;max-width:420px;flex-direction:column;gap:clamp(16px,4vw,22px);animation:fadeIn .4s ease-out}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .app-header h2{font-size:clamp(1.2rem,5vw,1.4rem);font-weight:800;color:#fff;text-align:center}
    .app-header p{font-size:.85rem;color:#94a3b8;text-align:center;margin-top:4px}
    .section-card{display:flex;flex-direction:column;gap:clamp(14px,3vw,18px)}
    .camera-container{position:relative;width:100%;aspect-ratio:1;max-height:55vh;background:#020617;border-radius:clamp(20px,5vw,28px);overflow:hidden;display:flex;align-items:center;justify-content:center;-webkit-mask-image:-webkit-radial-gradient(white,black)}
    #video{width:100%;height:100%;object-fit:cover;filter:contrast(1.05);transition:.3s}
    #video.front-camera{transform:scaleX(-1);-webkit-transform:scaleX(-1)}
    .face-guide-circle{position:absolute;width:70%;height:70%;max-width:280px;max-height:280px;border:2px dashed rgba(99,102,241,.6);border-radius:50%;pointer-events:none;z-index:5;transition:.3s}
    .face-guide-circle.active{border-color:#10B981;border-style:solid;border-width:3px;box-shadow:0 0 35px rgba(16,185,129,.5);transform:scale(1.02)}
    .icon-btn{position:absolute;top:14px;right:14px;width:32px;height:32px;background:0 0;color:#FFF;border:none;cursor:pointer;z-index:30;transition:.3s}
    .icon-btn:hover{transform:scale(1.15) rotate(180deg)}
    .icon-btn svg{width:18px;height:18px;stroke:currentColor;filter:drop-shadow(0 2px 4px rgba(0,0,0,.8))}
    .progress-container{width:100%;background:rgba(255,255,255,.08);height:6px;border-radius:4px;overflow:hidden;margin-top:2px}
    .progress-bar{width:0%;height:100%;background:linear-gradient(90deg,#6366F1,#10B981);transition:.05s}
    .status-box{font-size:clamp(.8rem,3vw,.9rem);font-weight:700;color:#94a3b8;text-align:center;min-height:24px}
    .btn{width:100%;padding:clamp(12px,3vw,14px) 16px;border:none;border-radius:20px;font-weight:700;font-size:clamp(.95rem,4vw,1rem);cursor:pointer;transition:.3s;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-primary{background:linear-gradient(135deg,#6366F1 0%,#4f46e5 100%);color:#fff;box-shadow:0 10px 25px rgba(99,102,241,.4)}
    .btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 15px 30px rgba(99,102,241,.6)}
    .btn-secondary{background:rgba(255,255,255,.05);color:#cbd5e1;border:1px solid rgba(255,255,255,.2)}
    .btn-secondary:hover{background:rgba(255,255,255,.15);color:#fff}
    #section-confirm,#section-success,#section-duplicate{display:none;text-align:center}
    .preview-container{width:100%;aspect-ratio:1;max-height:50vh;border-radius:clamp(20px,5vw,28px);overflow:hidden;border:3px solid #6366F1;background:#020617;margin-bottom:10px}
    .preview-container img{width:100%;height:100%;object-fit:cover}
    .flex-row{display:flex;gap:12px;margin-top:10px;width:100%}
    .flex-row .btn{flex:1}
    .success-avatar,.duplicate-avatar{width:clamp(100px,25vw,120px);height:clamp(100px,25vw,120px);margin:0 auto 10px;border-radius:50%;padding:4px;box-shadow:0 0 30px rgba(0,0,0,.4)}
    .success-avatar{background:linear-gradient(135deg,#10B981,#34D399)}
    .duplicate-avatar{background:linear-gradient(135deg,#F59E0B,#FBBF24)}
    .success-avatar img,.duplicate-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #1e293b}
    .info-group{background:rgba(15,23,42,.5);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:clamp(10px,3vw,12px) 16px;display:flex;flex-direction:column;gap:4px;text-align:left;margin-bottom:10px}
    .info-group label{font-size:.75rem;color:#94a3b8;text-transform:uppercase;font-weight:700}
    .info-group .value{font-size:clamp(1rem,4vw,1.1rem);color:#fff;font-weight:700}
    .info-group .value.highlight{color:#34D399;font-size:clamp(1.1rem,5vw,1.3rem)}
    .info-group .value.warning{color:#FBBF24;font-size:clamp(1.05rem,4vw,1.2rem)}
    .sync-status{font-size:.75rem;color:#94a3b8;margin-top:5px;font-weight:600}
    .copy-btn{background:rgba(52,211,153,.15);border:1px solid rgba(52,211,153,.3);color:#34D399;padding:6px 12px;border-radius:10px;font-size:.8rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
    .copy-btn.copied{background:#10B981;color:#fff}
    .flex-row-between{display:flex;justify-content:space-between;align-items:center}
  </style>
</head>
<body>
  <div class="app-card" id="app-card">
    <div class="app-header">
      <h2>Đăng Ký Khuôn Mặt</h2>
      <p id="header-subtitle">Hệ thống sẽ tự động chụp ảnh</p>
    </div>
    
    <div id="section-scan" class="section-card">
      <div class="camera-container" id="container">
        <button id="btn-switch" class="icon-btn" onclick="switchCamera()" title="Đổi camera" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 9a9 9 0 0 0-14.77-5.08L1 9"/><polyline points="1 4 1 9 6 9"/><path d="M3 15a9 9 0 0 0 14.77 5.08L23 15"/><polyline points="23 20 23 15 18 15"/></svg>
        </button>
        <div id="guide-circle" class="face-guide-circle"></div>
        <video id="video" autoplay muted playsinline></video>
      </div>
      <div class="progress-container"><div id="progress-bar" class="progress-bar"></div></div>
      <div id="status-box" class="status-box">Đang khởi động AI...</div>
    </div>

    <div id="section-confirm" class="section-card">
      <div class="preview-container"><img id="preview-img" src=""></div>
      <h3 style="color:#fff;font-weight:800;font-size:1.15rem;margin-bottom:-5px">Ảnh này đã chuẩn chưa?</h3>
      <p style="color:#94a3b8;font-size:.85rem">Đảm bảo ảnh chụp thẳng, không mờ.</p>
      <div class="flex-row">
        <button class="btn btn-secondary" onclick="retakePhoto()">🔄 Chụp lại</button>
        <button id="btn-save" class="btn btn-primary" onclick="confirmAndSave()">✅ Lưu ngay</button>
      </div>
    </div>

    <div id="section-duplicate" class="section-card">
      <div class="duplicate-avatar"><img id="dup-img" src=""></div>
      <h3 style="color:#FBBF24;font-weight:800;font-size:1.2rem">Khuôn mặt đã tồn tại!</h3>
      <div class="info-group">
        <label>Mã ID Đã Đăng Ký</label>
        <div class="flex-row-between">
          <div id="dup-id" class="value warning">---</div>
          <button class="copy-btn" onclick="copyID('dup-id',this)">Copy</button>
        </div>
      </div>
      <div class="info-group"><label>Thời Gian Đăng Ký Cũ</label><div id="dup-time" class="value">---</div></div>
      <button class="btn btn-primary" style="margin-top:10px" onclick="location.reload()">🔄 Thử lại người khác</button>
    </div>

    <div id="section-success" class="section-card">
      <div class="success-avatar"><img id="success-img" src=""></div>
      <h3 style="color:#34D399;font-weight:800;font-size:1.2rem">Đăng Ký Thành Công!</h3>
      <div class="info-group">
        <label>Mã ID Cấp Mới</label>
        <div class="flex-row-between">
          <div id="success-id" class="value highlight">---</div>
          <button class="copy-btn" onclick="copyID('success-id',this)">Copy</button>
        </div>
      </div>
      <div class="info-group"><label>Thời Gian Đăng Ký</label><div id="success-time" class="value">---</div></div>
      <div id="sync-status" class="sync-status">🔄 Đang đồng bộ Máy chủ...</div>
      <button class="btn btn-primary" style="margin-top:10px" onclick="location.reload()">Tiếp tục</button>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
