<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face ID - Register Fast</title>
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body, html { width: 100%; height: 100%; background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 100%); display: flex; justify-content: center; align-items: center; padding: 16px; color: #f8fafc; }
    .app-card { background: rgba(30, 41, 59, 0.65); backdrop-filter: blur(24px); padding: 28px; border-radius: 36px; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.08); width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 22px; animation: fadeIn 0.4s ease-out;}
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .app-header h2 { font-size: 1.4rem; font-weight: 800; color: #ffffff; text-align: center; }
    .section-card { display: flex; flex-direction: column; gap: 18px; }
    .camera-container { position: relative; width: 100%; aspect-ratio: 1; background: #020617; border-radius: 28px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    #video { width: 100%; height: 100%; object-fit: cover; filter: contrast(1.05); transition: 0.3s; }
    #video.front-camera { transform: scaleX(-1); }
    .face-guide-circle { position: absolute; width: 210px; height: 210px; border: 2px dashed rgba(99, 102, 241, 0.6); border-radius: 50%; pointer-events: none; z-index: 5; transition: 0.3s; }
    .face-guide-circle.active { border-color: #10B981; border-style: solid; border-width: 3px; box-shadow: 0 0 35px rgba(16, 185, 129, 0.5); transform: scale(1.02); }
    
    /* Nút Lật Camera - Chuyển lên góc trên, thu nhỏ */
    .icon-btn { position: absolute; top: 16px; right: 16px; width: 38px; height: 38px; background: transparent; color: #FFFFFF; border: none; outline: none; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 30; transition: transform 0.3s ease; }
    .icon-btn:hover { transform: scale(1.15) rotate(180deg); }
    .icon-btn svg { width: 22px; height: 22px; stroke: currentColor; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.8)); }
    
    .progress-container { width: 100%; background: rgba(255, 255, 255, 0.08); height: 6px; border-radius: 4px; overflow: hidden; margin-bottom: -10px;}
    .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #6366F1, #10B981); transition: 0.05s; }
    .status-box { font-size: 0.85rem; font-weight: 600; color: #94a3b8; text-align: center; min-height: 24px; }
    .btn { width: 100%; padding: 16px; border: none; border-radius: 20px; font-weight: 700; font-size: 1.05rem; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary { background: linear-gradient(135deg, #6366F1 0%, #4f46e5 100%); color: white; box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4); }
    .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(99, 102, 241, 0.6); }
    .btn-primary:disabled { background: #475569; box-shadow: none; cursor: not-allowed; color: #cbd5e1; }
    .btn-secondary { background: rgba(255, 255, 255, 0.05); color: #cbd5e1; border: 1px solid rgba(255, 255, 255, 0.1); }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); color: #ffffff; }
    .back-link { text-align: center; display: block; font-size: 0.85rem; font-weight: 600; color: #818cf8; text-decoration: none; }
    #section-success { text-align: center; display: none; }
    .success-avatar { width: 120px; height: 120px; margin: 0 auto 10px; border-radius: 50%; padding: 4px; background: linear-gradient(135deg, #10B981, #34D399); box-shadow: 0 0 30px rgba(16, 185, 129, 0.4); }
    .success-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #1e293b; }
    .info-group { background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; text-align: left; margin-bottom: 10px;}
    .info-group label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
    .info-group .value { font-size: 1.1rem; color: #ffffff; font-weight: 700; }
    .info-group .value.highlight { color: #34D399; font-size: 1.3rem; letter-spacing: 1px; }
    .sync-status { font-size: 0.75rem; color: #94a3b8; margin-top: 5px; font-weight: 600; }
    .copy-btn { background: rgba(52, 211, 153, 0.15); border: 1px solid rgba(52, 211, 153, 0.3); color: #34D399; padding: 6px 12px; border-radius: 10px; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
    .copy-btn:hover { background: rgba(52, 211, 153, 0.3); }
    .copy-btn.copied { background: #10B981; color: white; border-color: #10B981; }
    .flex-row { display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <div class="app-card">
    <div class="app-header"><h2>Đăng Ký Khuôn Mặt</h2></div>
    
    <div id="section-scan" class="section-card">
      <div class="camera-container" id="container">
        <button class="icon-btn" onclick="switchCamera()" title="Đổi camera">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 9a9 9 0 0 0-14.77-5.08L1 9"></path><polyline points="1 4 1 9 6 9"></polyline>
            <path d="M3 15a9 9 0 0 0 14.77 5.08L23 15"></path><polyline points="23 20 23 15 18 15"></polyline>
          </svg>
        </button>
        <div id="guide-circle" class="face-guide-circle"></div>
        <video id="video" autoplay muted playsinline></video>
      </div>

      <div class="progress-container"><div id="progress-bar" class="progress-bar"></div></div>
      <div id="status-box" class="status-box">Đang căn chỉnh camera...</div>
      <button id="btn-action" class="btn btn-primary" onclick="startScanningProcess()" disabled>⏳ Đang tải dữ liệu...</button>
      <a href="index.html" class="back-link">Quay về Check-in</a>
    </div>

    <div id="section-success" class="section-card">
      <div class="success-avatar"><img id="success-img" src="" alt="Avatar"></div>
      <h3 style="color: #34D399; font-weight: 800; font-size: 1.2rem;">Đăng Ký Thành Công!</h3>
      
      <div class="info-group">
        <label>Mã ID Nhân Sự</label>
        <div class="flex-row">
          <div id="success-id" class="value highlight">---</div>
          <button class="copy-btn" onclick="copyID('success-id', this)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy
          </button>
        </div>
      </div>
      
      <div class="info-group">
        <label>Thời Gian Ghi Nhận</label>
        <div id="success-time" class="value">---</div>
      </div>

      <div id="sync-status" class="sync-status">🔄 Đang đồng bộ với Máy chủ...</div>
      <button class="btn btn-secondary" style="margin-top: 10px;" onclick="window.location.reload()">Đăng ký người tiếp theo</button>
      <a href="index.html" class="back-link">Quay về Check-in</a>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx3nnZ45NKjve47jyhHHYYUTYxYExbxcoBGbn5SzfBHKBQtvtQ8HQSoyLopq7S4fJb9/exec"; 
    
    let currentStream = null, currentFacingMode = "user", existingFaceMatcher = null;
    let isDataReady = false, isScanningActive = false, scanTimer = 0, collectedDescriptors = [];
    let listExistingIDs = []; 

    const video = document.getElementById('video'), btnAction = document.getElementById('btn-action');
    const statusBox = document.getElementById('status-box'), progressBar = document.getElementById('progress-bar'), guideCircle = document.getElementById('guide-circle');
    
    function stopCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
        currentStream = null;
      }
      if (video) video.srcObject = null;
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        stopCamera();
        isScanningActive = false;
      } else {
        if (document.getElementById('section-scan').style.display !== 'none' && isDataReady) {
          startCamera(currentFacingMode);
        }
      }
    });
    window.addEventListener("pagehide", stopCamera);
    window.addEventListener("beforeunload", stopCamera);

    window.onload = async () => {
      await faceapi.nets.tinyFaceDetector.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models');
      await faceapi.nets.faceLandmark68Net.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models');
      await faceapi.nets.faceRecognitionNet.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models');
      fetchDatabaseAsync(); startCamera(currentFacingMode);
    };

    async function fetchDatabaseAsync() {
      try {
        const response = await fetch(SCRIPT_URL);
        const result = await response.json();
        if (result.status === "success" && result.data.length > 0) {
          const labeledDescriptors = [];
          for (let i = 0; i < result.data.length; i++) {
            const empId = String(result.data[i][0]), rawFaceData = result.data[i][2];
            if (!empId || !rawFaceData) continue;
            listExistingIDs.push(empId); 
            try {
              const parsed = typeof rawFaceData === 'string' ? JSON.parse(rawFaceData) : rawFaceData;
              if (Array.isArray(parsed)) labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(empId, [new Float32Array(parsed)]));
            } catch(e) {}
          }
          if (labeledDescriptors.length > 0) existingFaceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.40);
        }
      } catch(e) {}
      isDataReady = true; enableReadyState();
    }

    async function startCamera(facingMode) {
      stopCamera();
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 720 }, height: { ideal: 720 }, facingMode: facingMode } });
        video.srcObject = currentStream;
        video.className = facingMode === "user" ? "front-camera" : "back-camera";
        video.onloadedmetadata = () => { video.play(); enableReadyState(); };
      } catch(err) {}
    }

    function enableReadyState() {
      if (isDataReady && video.readyState >= 2) {
        statusBox.innerText = "Căn chỉnh khuôn mặt vào giữa vòng tròn";
        btnAction.disabled = false; btnAction.innerHTML = "🎯 Ấn để bắt đầu quét";
      }
    }

    function switchCamera() { currentFacingMode = (currentFacingMode === "user") ? "environment" : "user"; startCamera(currentFacingMode); }

    function startScanningProcess() {
      btnAction.disabled = true; btnAction.innerHTML = "🔍 Đang phân tích khuôn mặt...";
      statusBox.innerText = "Vui lòng giữ cố định khuôn mặt..."; statusBox.style.color = "#a5b4fc";
      scanTimer = 0; collectedDescriptors = []; isScanningActive = true;
      runInstantDetectionLoop();
    }

    async function runInstantDetectionLoop() {
      const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 });
      const targetTimeMs = 200; const frameIntervalMs = 25; let lastTime = Date.now();

      const detectFrame = async () => {
        if (!isScanningActive || video.paused || video.ended) return;
        const now = Date.now();
        if (now - lastTime >= frameIntervalMs) {
          lastTime = now;
          try {
            const detection = await faceapi.detectSingleFace(video, options).withFaceLandmarks().withFaceDescriptor();
            if (detection) {
              const box = detection.detection.box, vCenter = { x: video.videoWidth / 2, y: video.videoHeight / 2 }, fCenter = { x: box.x + box.width / 2, y: box.y + box.height / 2 };
              if (Math.abs(fCenter.x - vCenter.x) < 180 && Math.abs(fCenter.y - vCenter.y) < 180) {
                scanTimer += frameIntervalMs; collectedDescriptors.push(detection.descriptor);
                progressBar.style.width = `${Math.min(100, (scanTimer / targetTimeMs) * 100)}%`; guideCircle.classList.add('active');
                if (scanTimer >= targetTimeMs) { isScanningActive = false; executeFinalValidation(); return; }
              } else { resetCountdown("⚠ Đưa mặt vào giữa vòng tròn"); }
            } else { resetCountdown("🔍 Đang tìm kiếm khuôn mặt..."); }
          } catch (err) {}
        }
        if (isScanningActive) requestAnimationFrame(detectFrame);
      };
      requestAnimationFrame(detectFrame);
    }

    function resetCountdown(msg) {
      if (scanTimer > 0) { scanTimer = 0; progressBar.style.width = '0%'; guideCircle.classList.remove('active'); statusBox.innerText = msg; statusBox.style.color = "#f87171"; collectedDescriptors = []; }
    }

    async function executeFinalValidation() {
      video.pause();
      const canvas = document.createElement('canvas'); canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      if (currentFacingMode === "user") { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const avgDescriptor = getAverageDescriptor(collectedDescriptors);
      
      if (existingFaceMatcher) {
        const matchResult = existingFaceMatcher.findBestMatch(new Float32Array(avgDescriptor));
        if (matchResult.label !== "unknown") {
          alert(`⚠ Khuôn mặt này đã đăng ký với mã ID: "${matchResult.label}"!`);
          window.location.reload(); return;
        }
      }

      const now = new Date();
      const yy = String(now.getFullYear()).slice(-2), mm = String(now.getMonth() + 1).padStart(2, '0'), dd = String(now.getDate()).padStart(2, '0');
      const datePrefix = yy + mm + dd; 
      let isUnique = false, newId = "";
      while (!isUnique) {
        newId = datePrefix + Math.floor(10000 + Math.random() * 90000).toString();
        if (!listExistingIDs.includes(newId)) isUnique = true;
      }

      const imageBase64 = canvas.toDataURL('image/jpeg', 0.85);
      const timeWeb = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')} ${dd}/${mm}/${now.getFullYear()}`;

      showSuccessScreen(newId, timeWeb, imageBase64);

      const payload = { id: newId, faceData: JSON.stringify(avgDescriptor), time: timeWeb, imageBase64: imageBase64 };
      fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) })
        .then(response => response.json())
        .then(res => {
          if(res.status === "success") {
            const syncUI = document.getElementById('sync-status');
            syncUI.innerText = "✅ Đồng bộ máy chủ hoàn tất!"; syncUI.style.color = "#34D399";
          }
        }).catch(e => {
          const syncUI = document.getElementById('sync-status');
          syncUI.innerText = "⚠ Lỗi đồng bộ. Hãy kiểm tra mạng!"; syncUI.style.color = "#f87171";
        });
    }

    function getAverageDescriptor(descriptors) {
      if (descriptors.length === 0) return [];
      const len = descriptors[0].length, avg = new Float32Array(len);
      for (let i = 0; i < len; i++) {
        let sum = 0; for (let j = 0; j < descriptors.length; j++) sum += descriptors[j][i];
        avg[i] = sum / descriptors.length;
      }
      return Array.from(avg);
    }

    function showSuccessScreen(id, time, imageSrc) {
      stopCamera(); 
      document.getElementById('section-scan').style.display = 'none';
      document.getElementById('section-success').style.display = 'block';
      document.getElementById('success-id').innerText = id;
      document.getElementById('success-time').innerText = time;
      document.getElementById('success-img').src = imageSrc;
    }

    function copyID(elementId, btn) {
      const text = document.getElementById(elementId).innerText;
      navigator.clipboard.writeText(text).then(() => {
        const originalHTML = btn.innerHTML; btn.innerHTML = "✅ Đã chép"; btn.classList.add("copied");
        setTimeout(() => { btn.innerHTML = originalHTML; btn.classList.remove("copied"); }, 2000);
      });
    }
  </script>
</body>
</html>
